name: Atualiza o perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cabeçalho e cartão de contribuições
        run: python3 scripts/cartao.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cobrinha do gráfico de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#0f172a&color_dots=#ebedf0,#cfe1f7,#9cc2ee,#5a9be2,#2a78d6
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#12305a,#1a4f94,#2a6fd0,#3987e5

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Atualiza cabeçalho, cartão e cobrinha
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
